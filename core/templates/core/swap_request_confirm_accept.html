{% extends 'core/base.html' %}

{% block title %}Accept Swap · SkillSwap{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-9 col-md-7 col-lg-5">
    <div class="card card-swap">
      <div class="card-body p-4 p-sm-5 text-center">

        <span class="icon-badge mb-3"><i class="bi bi-check-circle" aria-hidden="true"></i></span>
        <h1 class="h4 text-swap-teal mb-2">Accept this swap with {{ swap.from_profile.user.username }}?</h1>
        <p class="text-muted small mb-4">
          This swap trades
          <span class="fw-semibold text-swap-teal">{{ swap.offered_skill.skill }}</span> for
          <span class="fw-semibold text-swap-teal">{{ swap.wanted_skill.skill }}</span>.
        </p>

        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2 justify-content-center">
            <button type="submit" class="btn btn-success">
              <i class="bi bi-check-lg me-1" aria-hidden="true"></i>Accept
            </button>
            <a href="{% url 'swap_request_list' %}" class="btn btn-outline-swap-teal">Cancel</a>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
{% endblock %}
