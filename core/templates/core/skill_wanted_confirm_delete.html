{% extends 'core/base.html' %}

{% block title %}Delete Skill · SkillSwap{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-9 col-md-7 col-lg-5">
    <div class="card card-swap">
      <div class="card-body p-4 p-sm-5 text-center">

        <span class="icon-badge mb-3"><i class="bi bi-trash" aria-hidden="true"></i></span>
        <h1 class="h4 text-swap-teal mb-2">Delete “{{ skill.skill }}”?</h1>
        <p class="text-muted small mb-4">
          This removes the skill from your wishlist. This action cannot be undone.
        </p>

        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2 justify-content-center">
            <button type="submit" class="btn btn-danger">
              <i class="bi bi-trash me-1" aria-hidden="true"></i>Delete
            </button>
            <a href="{% url 'skill_wanted_list' %}" class="btn btn-outline-swap-teal">Cancel</a>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
{% endblock %}
